heading: Όροι χρήσης
content: >-
  [Dummy κείμενο] Καλωσήρθες στους Όρους Χρήσης του SP Team. Η πρόσβαση και η
  χρήση αυτής της ιστοσελίδας υπόκεινται στους παρακάτω όρους. Χρησιμοποιώντας
  τον ιστότοπο, αποδέχεσαι πλήρως τους όρους αυτούς.


  1. Χρήση της υπηρεσίας. Το περιεχόμενο που παρέχεται μέσω της πλατφόρμας
  προορίζεται αποκλειστικά για προσωπική, μη εμπορική χρήση, εκτός αν έχει
  συμφωνηθεί διαφορετικά εγγράφως.


  2. Λογαριασμοί μελών. Είσαι υπεύθυνος/η για τη διατήρηση της
  εμπιστευτικότητας των στοιχείων πρόσβασής σου και για κάθε δραστηριότητα που
  πραγματοποιείται μέσω του λογαριασμού σου.


  3. Πληρωμές & συνδρομές. Οι χρεώσεις πραγματοποιούνται σύμφωνα με το πλάνο
  που έχεις επιλέξει. Μπορείς να ακυρώσεις τη συνδρομή σου οποιαδήποτε στιγμή,
  σύμφωνα με τους όρους που ισχύουν για το πακέτο σου.


  4. Πνευματική ιδιοκτησία. Όλο το περιεχόμενο, τα προγράμματα προπόνησης και
  διατροφής, καθώς και το υλικό της πλατφόρμας αποτελούν πνευματική ιδιοκτησία
  του SP Team.


  5. Περιορισμός ευθύνης. Το SP Team δεν φέρει ευθύνη για τραυματισμούς ή
  προβλήματα υγείας που προκύπτουν από τη μη ορθή εφαρμογή των προγραμμάτων.
  Συμβουλέψου πάντα γιατρό πριν ξεκινήσεις νέο πρόγραμμα άσκησης.


  Για οποιαδήποτε απορία σχετικά με τους όρους χρήσης, επικοινώνησε μαζί μας
  μέσω των στοιχείων επικοινωνίας στο footer.
