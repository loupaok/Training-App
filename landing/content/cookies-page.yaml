heading: Πολιτική Cookies
content: >-
  [Dummy κείμενο] Αυτή η ιστοσελίδα χρησιμοποιεί cookies για να εξασφαλίσει τη
  σωστή λειτουργία της και να βελτιώσει την εμπειρία πλοήγησής σου.


  1. Τι είναι τα cookies. Τα cookies είναι μικρά αρχεία κειμένου που
  αποθηκεύονται στη συσκευή σου όταν επισκέπτεσαι έναν ιστότοπο.


  2. Απαραίτητα cookies. Χρησιμοποιούνται για βασικές λειτουργίες της
  ιστοσελίδας, όπως η σύνδεση στο λογαριασμό σου, και δεν μπορούν να
  απενεργοποιηθούν.


  3. Cookies ανάλυσης. Μας βοηθούν να κατανοήσουμε πώς χρησιμοποιείς την
  ιστοσελίδα, ώστε να βελτιώνουμε συνεχώς την εμπειρία σου.


  4. Διαχείριση cookies. Μπορείς να διαχειριστείς ή να απενεργοποιήσεις τα
  cookies μέσω των ρυθμίσεων του browser σου, έχοντας υπόψη ότι κάποιες
  λειτουργίες της ιστοσελίδας ενδέχεται να επηρεαστούν.


  Για περισσότερες πληροφορίες, επικοινώνησε μαζί μας μέσω των στοιχείων
  επικοινωνίας στο footer.
