heading: Πολιτική Απορρήτου
content: >-
  [Dummy κείμενο] Το SP Team σέβεται την ιδιωτικότητά σου. Αυτή η πολιτική
  εξηγεί ποια δεδομένα συλλέγουμε, πώς τα χρησιμοποιούμε και ποια δικαιώματα
  έχεις.


  1. Δεδομένα που συλλέγουμε. Συλλέγουμε στοιχεία όπως όνομα, email, τηλέφωνο
  και πληροφορίες πληρωμής όταν εγγράφεσαι ή αγοράζεις κάποιο πακέτο, καθώς και
  δεδομένα προόδου (βάρος, μετρήσεις, φωτογραφίες) που μας παρέχεις οικειοθελώς
  για την παρακολούθηση του προγράμματός σου.


  2. Χρήση δεδομένων. Τα δεδομένα σου χρησιμοποιούνται για την παροχή των
  υπηρεσιών coaching, την επικοινωνία μαζί σου και τη βελτίωση της εμπειρίας
  σου στην πλατφόρμα. Δεν πουλάμε τα προσωπικά σου δεδομένα σε τρίτους.


  3. Ασφάλεια. Λαμβάνουμε εύλογα τεχνικά και οργανωτικά μέτρα για την
  προστασία των δεδομένων σου από μη εξουσιοδοτημένη πρόσβαση.


  4. Τα δικαιώματά σου. Έχεις δικαίωμα πρόσβασης, διόρθωσης ή διαγραφής των
  προσωπικών σου δεδομένων ανά πάσα στιγμή, επικοινωνώντας μαζί μας.


  5. Cookies. Χρησιμοποιούμε cookies για τη λειτουργία της ιστοσελίδας — δες
  την Πολιτική Cookies για περισσότερες λεπτομέρειες.


  Για ερωτήσεις σχετικά με το απόρρητο, επικοινώνησε μαζί μας μέσω των
  στοιχείων επικοινωνίας στο footer.
