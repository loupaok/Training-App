eyebrow: FAQ
heading: Συχνές ερωτήσεις.
items:
  - question: Χρειάζομαι γυμναστήριο;
    answer: Όχι. Το πλάνο φτιάχνεται με βάση τον εξοπλισμό που έχεις — γυμναστήριο, σπίτι ή συνδυασμό.
  - question: Πόσο γρήγορα παίρνω το πλάνο μου;
    answer: Μέσα σε [Χ] ημέρες από τη συμπλήρωση του ερωτηματολογίου.
  - question: Πώς λειτουργούν οι πόντοι;
    answer: Κάθε πληρωμή σου δίνει πόντους, τους οποίους εξαργυρώνεις σε έκπτωση, 1:1 βιντεοκλήσεις ή SP Team merch.
  - question: Δεν έχω χρησιμοποιήσει ποτέ Discord.
    answer: Κανένα πρόβλημα. Είναι ο τρόπος που μιλάμε με μηνύματα, φωνητικά και video. Χρειάζεσαι μόνο έναν δωρεάν λογαριασμό.
  - question: Μπορώ να ακυρώσω;
    answer: Ναι, όποτε θες, χωρίς δέσμευση.
  - question: Είναι για αρχάριους;
    answer: Απόλυτα. Κάθε πλάνο ξεκινά από το επίπεδό σου, με βίντεο εκτέλεσης για κάθε άσκηση.
